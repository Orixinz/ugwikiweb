<!DOCTYPE html>
<html>
<head>
  <title>UGWiki</title>
  <link rel="stylesheet" href="/styles.css"/>

  <script id="discord:component-embed" type="application/json">
    {
        "component": {
            "type": 17,
            "components": [
                {
                    "type": 10,
                    "content": "## Ultraw Games Wikis"
                },
                {
                    "type": 1,
                    "components": [
                        {
                            "type": 2,
                            "style": 5,
                            "url": "https://rt3.ugwiki.org",
                            "label": "Restaurant Tycoon 3"
                        },
                        {
                             "type": 2,
                            "style": 5,
                            "url": "https://gt2.ugwiki.org",
                            "label": "Gym Tycoon 2"
                        },
                        {
                             "type": 2,
                            "style": 5,
                            "url": "https://restaurant-tycoon-2.fandom.com/",
                            "label": "Restaurant Tycoon 2"
                        }
                    ]
                }
            ]
        }
    }
  </script>
</head>
<body>
  <div class="content">
    <span style="font-weight: bold;"> We create wikis for Roblox
      <large id="changetext" class>Tycoons</large>
    </span>
    <line></line>
    <div class="hidden" id="showonanim">
      <p> Check them out: </p>
      <div class="list-container">
        <navbutton>
          <a href="https://rt3.ugwiki.org/">
            <img src="https://static.wikitide.net/rt3wiki/2/26/Favicon.png" width=100 />
          </a>
        </navbutton>
        <navbutton>
          <a href="https://gt2.ugwiki.org/">
            <img src="https://static.wikitide.net/gymislandwiki/1/16/SiteLogo.png" width=100 />
          </a>
        </navbutton>
        <navbutton>
          <a href="https://restaurant-tycoon-2.fandom.com/">
            <img src="https://static.wikia.nocookie.net/restaurant-tycoon-2/images/c/c9/Logo.png" width=100 />
          </a>
        </navbutton>
      </div>
    </div>
  </div>
  <footer>
    UGWiki is not affilated with Ultraw Games Inc. This page is available under
    <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> on <a
      href="https://github.com/Orixinz/ugwikiweb">GitHub</a>.
  </footer>

  <script>
    let words = ["Experiences", "Masterpieces"];
    const text = document.querySelector("#changetext")

    const showafter = document.querySelector("#showonanim");

    async function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }


    async function main() {
      for (let i = 0; i < words.length; i++) {
        await sleep(1000);
        text.className = "strikethrough";
        await sleep(1000);
        text.className = "";
        await sleep(100);
        text.textContent = "";

        let word = words[i]

        console.log(word.length)
        for (let x = 0; x < word.length; x++) {
          text.textContent += word[x];
          await sleep(100);
        }
        text.textContent = word;
      }

      showafter.className = "";
    }

    main();
  </script>
</body>

</html>
